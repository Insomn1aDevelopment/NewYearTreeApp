<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

<div id="app">
  <header class="hud">

    <nav class="rooms" id="rooms" aria-label="Комнаты">
      <button data-room="kitchen" aria-label="Кухня"><svg viewBox="0 0 28 28"><path d="M21 17Q26 15 26 10" stroke="#e23b4a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M6 22Q4 12 14 11Q24 12 22 22Z" fill="#e23b4a"/><path d="M9 12Q14 4 19 12" stroke="#fff" stroke-width="2" fill="none"/><circle cx="14" cy="10" r="2" fill="#fff"/><circle cx="10" cy="17" r="1.4" fill="#fff"/><circle cx="16" cy="19" r="1.4" fill="#fff"/><rect x="5" y="22" width="18" height="3" rx="1.5" fill="#3a3a3a"/></svg><span>Кухня</span></button>
      <button data-room="living" aria-label="Гостиная"><svg viewBox="0 0 28 28"><rect x="3" y="7" width="22" height="18" rx="2" fill="#f1e4cc"/><rect x="2" y="5" width="24" height="4" rx="1.5" fill="#8a5a3b"/><path d="M8 25V16Q14 10 20 16V25Z" fill="#3a1a12"/><path d="M11 24Q10 19 14 15Q18 19 17 24Z" fill="#ff9a2e"/><path d="M13 24Q12.6 21 14 19Q15.4 21 15 24Z" fill="#ffe28a"/></svg><span>Гостиная</span></button>
      <button data-room="bedroom" aria-label="Спальня"><svg viewBox="0 0 28 28"><rect x="3" y="15" width="22" height="7" rx="2" fill="#3a7bd5"/><rect x="4" y="11" width="9" height="5" rx="2.5" fill="#fff"/><rect x="2" y="9" width="3" height="16" rx="1.5" fill="#b07a4a"/><rect x="23" y="13" width="3" height="12" rx="1.5" fill="#b07a4a"/><path d="M19 3a4 4 0 1 0 3 6a3 3 0 1 1-3-6z" fill="#f2d48a"/></svg><span>Спальня</span></button>
    </nav>
    <div class="meters">
      <button class="ring" id="mW" style="--c:var(--water)" aria-label="Вода"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="val" id="mWater" cx="22" cy="22" r="18"/></svg><svg class="ico" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.5c2.6 3.3 4.5 5.6 4.5 8.1a4.5 4.5 0 0 1-9 0C3.5 7.1 5.4 4.8 8 1.5z"/></svg></button>
      <button class="ring" id="mJ" style="--c:var(--joy)" aria-label="Радость"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="val" id="mJoy" cx="22" cy="22" r="18"/></svg><svg class="ico" viewBox="0 0 16 16"><path fill="currentColor" d="M8 14C2 10 1 6.6 2.6 4.4 4 2.6 6.6 2.8 8 4.8c1.4-2 4-2.2 5.4-.4C15 6.6 14 10 8 14z"/></svg></button>
      <button class="ring" id="mE" style="--c:var(--sleep)" aria-label="Бодрость"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="val" id="mEnergy" cx="22" cy="22" r="18"/></svg><svg class="ico" viewBox="0 0 16 16"><path fill="currentColor" d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg></button>
    </div>
    <button class="icon-btn" id="sndBtn" aria-label="Звук"></button>
  </header>

  <main id="stage">
    <svg id="scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs">
        <pattern id="wp" width="32" height="32" patternUnits="userSpaceOnUse">

          <circle cx="0" cy="32" r="1.8" fill="#e7ad52" opacity=".25"/><circle cx="32" cy="32" r="1.8" fill="#e7ad52" opacity=".25"/>
        </pattern>
        <pattern id="planks" width="96" height="36" patternUnits="userSpaceOnUse">

          <rect y="17" width="96" height="1.3" fill="#4d2b17"/><rect y="35" width="96" height="1.3" fill="#4d2b17"/>

        <pattern id="brick" width="20" height="12" patternUnits="userSpaceOnUse">

          <path d="M0 5.6H20M0 11.6H20M10 0V5.6M0 6V12M20 6V12" stroke="#5e2416" stroke-width="1.2"/>

        <pattern id="knit" width="8" height="6" patternUnits="userSpaceOnUse">
          <path d="M0 0 L4 5 L8 0" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="1.2"/>
        </pattern>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#3a4a82"/></linearGradient>
        <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1"><stop id="tg1" offset="0" stop-color="#57b86b"/><stop id="tg2" offset="1" stop-color="#1d6a39"/></linearGradient>
        <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173f33"/><stop offset=".5" stop-color="#245a49"/><stop offset="1" stop-color="#143628"/></linearGradient>
        <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff6cf" stop-opacity=".85"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/></radialGradient>
        <radialGradient id="warmGlow"><stop offset="0" stop-color="#ffb347" stop-opacity=".8"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
        <radialGradient id="gGold"><stop offset="0" stop-color="#ffe08a" stop-opacity=".75"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
        <radialGradient id="gRed"><stop offset="0" stop-color="#ff5a6a" stop-opacity=".7"/><stop offset="1" stop-color="#ff5a6a" stop-opacity="0"/></radialGradient>
        <radialGradient id="gIce"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".8"/><stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="globeGlass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".6" stop-color="#cfe6ff" stop-opacity=".18"/><stop offset="1" stop-color="#9cc3ea" stop-opacity=".35"/></radialGradient>
        <radialGradient id="pearl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#efe6f2"/><stop offset="1" stop-color="#b9a9c2"/></radialGradient>

        <clipPath id="globeClip"><circle cx="302" cy="330" r="12.5"/></clipPath>
        <mask id="nightMask" maskUnits="userSpaceOnUse" x="-800" y="-1000" width="2000" height="2800">

          <rect x="25" y="78" width="112" height="214" fill="#5a5a5a"/>
          <path d="M314 530 L314 446 Q348 418 382 446 L382 530 Z" fill="#000"/>
        </mask>
      </defs>

      <!-- ROOM -->

        <rect x="-800" y="432" width="2000" height="7" fill="#c99a5b"/>

        <rect x="79" y="64" width="4" height="214" fill="#f1e4cc"/>

        <path d="M8 60 Q12 150 22 228 M18 60 Q22 150 32 228 M146 60 Q144 150 136 228 M156 60 Q154 150 146 228" stroke="#0e2a20" stroke-width="1.4" fill="none" opacity=".6"/>
        <rect x="18" y="222" width="26" height="8" rx="4" fill="#d9a94e"/><rect x="120" y="222" width="26" height="8" rx="4" fill="#d9a94e"/>

        </g>
        <g data-hit="mandarin">

        </g>

          <circle cx="318" cy="84" r="3" fill="#2b1519"/><circle cx="362" cy="84" r="3" fill="#2b1519"/>
        </g>

        <g data-hit="wreath" id="wreath">

          <ellipse class="candle-f" cx="330" cy="321" rx="2" ry="4" fill="#ffc94a"/><ellipse class="candle-f" cx="340" cy="327" rx="2" ry="4" fill="#ffc94a"/>

      </g>

      <g id="room-kitchen" class="room" style="display:none"></g>
      <g id="room-bedroom" class="room" style="display:none"></g>

      <rect id="night" x="-800" y="-1000" width="2000" height="2800" fill="#0a0f2c" style="opacity:0" mask="url(#nightMask)" pointer-events="none"/>

        </g>
        <g id="glow-kitchen" style="display:none"></g>
        <g id="glow-bedroom" style="display:none"></g>
        <g id="treeGlow"><g id="lights"></g><g id="topper"></g><g id="glints"></g></g>
      </g>
      <g id="fx" pointer-events="none">
        <g id="can" opacity="0">
          <g id="canBody">
            <path d="M-36 -14 L-12 2" stroke="#3f8ccf" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="-37" cy="-15" rx="3.2" ry="5" fill="#2c6aa3" transform="rotate(-35 -37 -15)"/>
            <rect x="-16" y="-14" width="34" height="30" rx="7" fill="#56a6e6" stroke="#2c6aa3" stroke-width="1.6"/>
            <path d="M16 -8 Q30 -10 26 6 Q24 14 16 12" fill="none" stroke="#2c6aa3" stroke-width="4"/>
            <rect x="-16" y="-2" width="34" height="5" fill="#f2bd4b"/>
            <rect x="-8" y="-18" width="20" height="5" rx="2" fill="#2c6aa3"/>
          </g>
        </g>
      </g>
    </svg>
    <div id="bubble" hidden></div>
    <div class="roomtag" id="roomTag" hidden></div>
  </main>

  <section class="sheet" id="sheet" hidden>
    <div class="grab" id="grab" aria-hidden="true"></div>
    <div class="sh-head" id="shHead"></div>
    <div class="sh-body" id="shBody"></div>
  </section>

  <nav class="dock" id="dock">
    <button data-dock="decor" style="--bc:#ff6f9f"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="14.5" r="6.5"/><path d="M10 8V5.5h4V8M12 5.5V3"/><path d="M6.3 12.6c3.4 1.4 8 1.4 11.4 0" stroke-linecap="round"/></svg></span>Наряд</button>
    <button data-dock="water" style="--bc:#45a6ff"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c3.6 4.6 6 7.7 6 11a6 6 0 0 1-12 0c0-3.3 2.4-6.4 6-11z"/><path d="M9 14.5a3 3 0 0 0 3 3" stroke-linecap="round"/></svg></span>Полить</button>
    <button data-dock="say" style="--bc:#ff9f2e"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h-1A.5.5 0 0 1 4 15.5z"/><path d="M8.5 10h.01M12 10h.01M15.5 10h.01" stroke-width="2.8" stroke-linecap="round"/></svg></span>Скажи</button>
    <button data-dock="games" style="--bc:#35b864"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.4 1.8L14.5 14h-5l-1.1 1.3A3 3 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"/><path d="M8 10.5v3M6.5 12h3" stroke-linecap="round"/><path d="M15.5 11.3h.01M17.6 12.7h.01" stroke-width="2.6" stroke-linecap="round"/></svg></span>Игры</button>
    <button data-dock="night" id="nightBtn" style="--bc:#8b78ff"></button>
  </nav>

  <div id="toast" hidden></div>

  <div id="game" hidden>
    <canvas id="gBg"></canvas>
    <div class="g-top">
      <button class="icon-btn" id="gClose" aria-label="Выйти из игры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="gTitle">Игра</h2>
      <div id="gScore"></div>
    </div>
    <div id="gArea"></div>
    <div id="gResult" hidden></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
